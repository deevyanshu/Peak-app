spring.application.name=auth-service
server.port=8081
# using this to load dispatcher servlet early instead of lazy load to make first request fast
spring.mvc.servlet.load-on-startup: 1

# Direct Database Connection URL
spring.datasource.url=jdbc:postgresql://localhost:5432/peakdb
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# Set to 'none' or 'validate' because Flyway handles the DDL migrations now
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migration Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Redis configuration
spring.data.redis.password=root
spring.data.redis.sentinel.master=mymaster
spring.data.redis.sentinel.nodes=127.0.0.1:26379,127.0.0.1:26380,127.0.0.1:26381

# Java mail sender
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=peakapp12@gmail.com
spring.mail.password=fvonurdzsmduurcr
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Oauth2 configuration
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
