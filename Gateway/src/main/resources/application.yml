eureka:
  instance:
    prefer-ip-address: true

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 9090

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      enabled: true
      server:
        webflux:
          routes:
            - id: AUTH-SERVICE
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: authCircuitBreaker
                    fallbackUri: forward:/fallback/authFallback

            - id: PROFILE-SERVICE
              uri: lb://PROFILE-SERVICE
              predicates:
                - Path=/api/v1/profile/**
              filters:
                - AuthFilter
                - name: CircuitBreaker
                  args:
                    name: profileCircuitBreaker
                    fallbackUri: forward:/fallback/profileFallback

  data:
    redis:
      password: root
      sentinel:
        master: mymaster
        nodes:
          - 127.0.0.1:26379
          - 127.0.0.1:26380
          - 127.0.0.1:26381

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50           # Open circuit if 50% of calls fail
        waitDurationInOpenState: 10s       # Time before transitioning to HALF-OPEN
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: COUNT_BASED
    instances:
      authCircuitBreaker: {}
      profileCircuitBreaker: {}


  timelimiter:
    instances:
      authCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true
      profileCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: ALWAYS

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.loadbalancer: TRACE
    reactor.netty.http.client: DEBUG