spring.application.name=profile-service
server.port=8082
# using this to load dispatcher servlet early instead of lazy load to make first request fast
spring.mvc.servlet.load-on-startup: 1

#Virtual thread configuration
spring.threads.virtual.enabled=true

# Direct Database Connection URL
spring.datasource.url=jdbc:postgresql://localhost:5432/profiledb
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# Set to 'none' or 'validate' because Flyway handles the DDL migrations now
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migration Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000

# Prevent unexpected DB connection checkouts outside transactions
spring.jpa.open-in-view=false

## Delay acquiring a DB connection until SQL actually executes
#spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

#Redis config
spring.data.redis.password=root
spring.data.redis.sentinel.master=mymaster
spring.data.redis.sentinel.nodes=127.0.0.1:26379,127.0.0.1:26380,127.0.0.1:26381

#Eureka configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

#GCP cloud storage
spring.cloud.gcp.project-id=${PROJECT_ID}
gcp.bucket.name=${BUCKET_NAME}
gcp.quarantine.bucket.name=${QUARANTINE_BUCKET_NAME}
gcp.pubsub.subscription=quarantine-local-sub
quarantine.pubsub.worker-threads:2
quarantine.pubsub.max-outstanding-elements:10
quarantine.pubsub.max-outstanding-bytes:26214400
